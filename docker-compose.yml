services:
  db:
    image: postgis/postgis:15-3.3
    container_name: accommodation_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: accommodation_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: accommodation_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: accommodation_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/accommodation_db
      REDIS_URL: redis://redis:6379
      AUTH_TRUSTED_PROXY_IPS: ${AUTH_TRUSTED_PROXY_IPS:-}
      SECRET_KEY: ${SECRET_KEY}
      MODERATOR_INVITE_KEY: ${MODERATOR_INVITE_KEY}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME}
      AZURE_DOCUMENT_CONTAINER_NAME: ${AZURE_DOCUMENT_CONTAINER_NAME:-verification-documents}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  nlp:
    build: ./nlp-service
    container_name: accommodation_nlp
    ports:
      - "8001:8001"
    volumes:
      - ./nlp-service:/app

volumes:
  postgres_data:
  nlp_model_cache:
